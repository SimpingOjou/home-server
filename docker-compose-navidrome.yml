services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    # user: "1000:1000" # Match your local user
    # ports:
    #   - "4533:4533"
    network_mode: "host"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_BASEURL: "" # Set this if using a reverse proxy subpath
    volumes:
      - ${HOME_PATH}/navidrome/data:/data
      - ${DATA_PATH}/media/music:/music:ro # Read-only for the streamer
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: "host"
    environment:
      - PUID=1000 # Run 'id' in your terminal to confirm
      - PGID=1000
      - TZ=Etc/UTC # e.g., America/New_York
    volumes:
      - ${HOME_PATH}/lidarr/config:/config
      - ${DATA_PATH}/media/music:/music
      - ${DATA_PATH}/media/dwl:/downloads # THIS MUST MATCH YOUR DOWNLOADER'S PATH
    restart: unless-stopped