version: '3.8'

services:
  ### MANAGEMENT
  portainer:
    image: portainer/portainer-ce:latest
    command: -H unix:///var/run/docker.sock
    # networks:
    #   - lab_network
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: host  # <--- Questo bypassa il routing mesh e spara la porta direttamente sul server
      - target: 9443
        published: 9443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME_PATH}/portainer:/data
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 512M
  
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    # user: "1000:1000"
    networks:
      - lab_network
    ports:
      - target: 3001
        published: 3001
        protocol: tcp
        mode: host
    volumes:
      - ${HOME_PATH}/uptime-kuma:/app/data
    deploy:
      restart_policy:
        condition: on-failure

  ### INFRASTRUCTURE
  tunnel:
    image: cloudflare/cloudflared:latest
    user: "1000:1000"
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - lab_network
    deploy:
      restart_policy:
        condition: on-failure

  ### WEB UI
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    user: "1000:1000"
    environment: 
      - HOMEPAGE_ALLOWED_HOSTS=www.topolini.cc,topolini.cc
    networks:
      - lab_network
    volumes:
      - ${HOME_PATH}/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M

  ### PASSWORDS (Vaultwarden)
  vaultwarden:
    image: vaultwarden/server:latest
    networks:
      - lab_network
    volumes:
      - ${HOME_PATH}/vaultwarden:/data
    environment:
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      # Allow signups initially to create your account, then change to false!
      - SIGNUPS_ALLOWED=true 
    ports:
      - target: 80
        published: 8081 # Exposed locally if needed, but Cloudflare Tunnel is better
        protocol: tcp
        mode: host
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M

  ### MUSIC
  navidrome:
    image: deluan/navidrome:latest
    hostname: navidrome
    networks:
      - lab_network
    ports:
      - target: 4533
        published: 4533
        protocol: tcp
        mode: host
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_BASEURL: https://music.topolini.cc
    volumes:
      - ${HOME_PATH}/navidrome/data:/data
      - ${DATA_PATH}/media/music:/music:ro
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 4G

  ### PERSONAL CLOUD
  redis:
    image: redis:alpine
    networks:
      - lab_network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512MB

  db:
    image: mariadb:10.6
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    networks:
      - lab_network
    volumes:
      - ${HOME_PATH}/nextcloud:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 2G

  nextcloud:
    image: nextcloud:latest
    networks:
      - lab_network
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: host
    volumes:
      - ${DATA_PATH}/apps/nextcloud/data:/var/www/html
    environment:
      - MYSQL_HOST=db
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - REDIS_HOST=redis
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 8G

  ### ZOTERO (WEBDAV)
  zotero-webdav:
    image: bytemark/webdav:latest
    networks:
      - lab_network
    ports:
      - target: 80
        published: 8082
        protocol: tcp
        mode: host
    environment:
      - AUTH_TYPE=Basic
      - USERNAME=${ZOTERO_USER}
      - PASSWORD=${ZOTERO_WEBDAV_PASSWORD} 
    volumes:
      - ${DATA_PATH}/zotero:/var/lib/dav
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    networks:
      - torrent_network  # <--- Forza l'uso della rete isolata
      - lab_network  # <--- Allows Radarr/Sonarr/Prowlarr to communicate with it
    environment:
      - PUID=1000
      - PGID=1000
      - USER=${TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASS}
    volumes:
      - ${HOME_PATH}/transmission/config:/config
      - ${DATA_PATH}/media:/downloads
    ports:
      - target: 9091
        published: 9091
        protocol: tcp
        mode: host 
      - target: 51413
        published: 51413
        protocol: tcp
        mode: host
      - target: 51413
        published: 51413
        protocol: udp
        mode: host

  ### DNS config
  pihole:
    image: pihole/pihole:latest
    hostname: pihole-topolini
    networks:
      - lab_network
    ports:
      - target: 53
        published: 53
        protocol: tcp
        mode: host
      - target: 53
        published: 53
        protocol: udp
        mode: host
      - target: 80
        published: 8053 
        protocol: tcp
        mode: host
    environment:
      - TZ=Europe/Rome
      - WEBPASSWORD=${PIHOLE_PASSWORD}
      - FTLCONF_LOCAL_IPV4=${PIHOLE_IPV4}
    volumes:
      - ${HOME_PATH}/pihole/config:/etc/pihole
      - ${HOME_PATH}/pihole/dnsmasq.d:/etc/dnsmasq.d
    deploy:
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 3G

  ### INDEXER MANAGER
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - lab_network
    ports:
      - target: 9696
        published: 9696
        protocol: tcp
        mode: host
    deploy:
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
    volumes:
      - ${HOME_PATH}/prowlarr/config:/config

  ### MOVIES
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - lab_network
    ports:
      - target: 7878
        published: 7878
        protocol: tcp
        mode: host
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - ${HOME_PATH}/radarr/config:/config
      - ${DATA_PATH}/media:/media 

  ### SERIES
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - lab_network
    ports:
      - target: 8989
        published: 8989
        protocol: tcp
        mode: host
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - ${HOME_PATH}/sonarr/config:/config
      - ${DATA_PATH}/media:/media 
  
  ### MUSIC
  # lidarr:
  #   image: lscr.io/linuxserver/lidarr:latest
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #   networks:
  #     - lab_network
  #   ports:
  #     - target: 8686
  #       published: 8686
  #       protocol: tcp
  #       mode: host
  #   deploy:
  #     restart_policy:
  #       condition: on-failure
  #   volumes:
  #     - ${HOME_PATH}/lidarr/config:/config
  #     - ${DATA_PATH}/media:/media 

  ### REQUEST MANAGEMENT
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - lab_network
    ports:
      - target: 5055
        published: 5055
        protocol: tcp
        mode: host
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - ${HOME_PATH}/jellyseerr/config:/app/config
      - ${DATA_PATH}/media:/media 

  ### CLOUDFLARE BYPASS
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    networks:
      - lab_network
    ports:
      - target: 8191
        published: 8191
        protocol: tcp
        mode: host
    environment:
      - LOG_LEVEL=info
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 1G

  # gluetun:
